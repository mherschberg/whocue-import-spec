name: Import Spec CI

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  validate:
    name: Validate schema and examples
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Verify repository structure
        run: bash .github/scripts/check-structure.sh

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: "24"
          cache: npm

      - name: Install validator dependencies
        run: npm ci

      - name: Validate schema and fixture corpus
        run: npm run validate
